[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gitnextver"
dynamic = ["version"]
description = "Automatically bump semantic version tags in Git repositories"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Adam Twardoch", email = "adam+github@twardoch.com" },
]
keywords = ["git", "version", "semver", "tag", "bump"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fire",
    "GitPython",
    "loguru",
    "rich",
]

[project.scripts]
gitnextver = "gitnextver.cli:app"

[project.urls]
Homepage = "https://github.com/twardoch/gitnextver"
Repository = "https://github.com/twardoch/gitnextver"
Issues = "https://github.com/twardoch/gitnextver/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gitnextver/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gitnextver"]

[tool.hatch.build.targets.sdist]
only-include = ["src/gitnextver", "tests", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
