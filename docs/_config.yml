title: gitnextver
description: >-
  Automatically bump the patch component of a vX.Y.Z git tag, commit all
  staged changes, and push — one command to cut a release.

remote_theme: just-the-docs/just-the-docs

url: https://twardoch.github.io
baseurl: /gitnextver

search_enabled: true
nav_sort: case_insensitive

footer_content: >-
  Copyright &copy; 2024&#8211;2026 Adam Twardoch.
  Distributed under the
  <a href="https://github.com/twardoch/gitnextver/blob/main/LICENSE">Apache-2.0 License</a>.

# GitHub link in the top-right corner
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/twardoch/gitnextver
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
